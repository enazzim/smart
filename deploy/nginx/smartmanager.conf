# Smart-Manager Nginx site (Amazon Linux 2023)
#   sudo cp deploy/nginx/smartmanager.conf /etc/nginx/conf.d/smartmanager.conf
#   sudo nginx -t && sudo systemctl reload nginx
# default_server 충돌 시 기존 /etc/nginx/conf.d/*.conf 또는 nginx.conf 조정
#
# 프론트 접속: http://<host>/smartmanager/
# 정적 파일:   /var/smartmanager/www/smartmanager/

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 3.36.75.21 _;

    root /var/smartmanager/www;
    index index.html;

    # Spring multipart max-request-size(1050MB)와 맞춤
    client_max_body_size 1050m;

    # 루트는 앱 서브경로로 이동
    location = / {
        return 301 /smartmanager/;
    }

    # Vite 해시 청크 — 장기 캐시. 없으면 index.html로 위장하지 않음(배포 후 MIME 오류 방지)
    location /smartmanager/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA 진입점 — 배포마다 최신 번들 맵을 받도록 캐시 금지
    location = /smartmanager/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # SPA under /smartmanager/
    location /smartmanager/ {
        try_files $uri $uri/ /smartmanager/index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 도면 WebSocket (SockJS + STOMP)
    location /ws-drawing/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Actuator 외부 차단
    location /actuator/ {
        deny all;
        return 404;
    }
}
