spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/smartmanager?createDatabaseIfNotExist=true&characterEncoding=utf8mb4&serverTimezone=Asia/Seoul
    username: root
    password: "1111"
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

logging:
  level:
    org.hibernate.SQL: warn
    org.flywaydb: info

smartmanager:
  security:
    jwt:
      secret: local-dev-secret-key-minimum-32-characters!!
      expiration-minutes: 480
    admin:
      login-id: admin
      initial-password: Admin123!
      enabled: true
  board:
    files-dir: ../../filedownload
    max-file-size-bytes: 104857600
    allowed-extensions: pdf,doc,docx,xls,xlsx,png,jpg,jpeg,zip
  backup:
    dir: ../../backup
    mariadb-bin-dir: "C:/Program Files/MariaDB 11.4/bin"
