spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/kit_erp?characterEncoding=utf8mb4&serverTimezone=Asia/Seoul
    username: root
    password: "1111"
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 2
    validate-on-migrate: true

logging:
  level:
    org.hibernate.SQL: warn
    org.flywaydb: info
